services:
  web:
    build:
      context: .
      target: development
    working_dir: /app
    command: >-
      sh -c 'npx prisma generate && npm run dev -- --hostname 0.0.0.0'
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - prisma_generated:/app/generated
      - next_cache:/app/.next
    environment:
      WATCHPACK_POLLING: "true"

volumes:
  node_modules:
  prisma_generated:
  next_cache:
